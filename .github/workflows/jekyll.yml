name: Deploy Jekyll site to Pages and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (Format: <år>.<løpenr>). La stå tom for å teste uten å opprette Release.'
        required: false
        type: string
  pull_request:
    branches:
      - main

permissions:
  contents: write # Nødvendig for å opprette GitHub Release
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Tillat Puppeteer sandbox (Ubuntu 24.04 fix)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build PDFs
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            TIMESTAMP=$(TZ="Europe/Oslo" date +"%Y-%m-%d %H:%M")
            HEADER="<div style=\"width: 100%; text-align: center; font-size: 14px; font-family: sans-serif; color: red; font-weight: bold;\">UTKAST - $TIMESTAMP</div>"
            jq --arg header "$HEADER" '.pdf_options.headerTemplate = $header' pdf-config.json > pdf-config-tmp.json
            mv pdf-config-tmp.json pdf-config.json
          fi
          npx md-to-pdf vedtekter.md --config-file pdf-config.json
          npx md-to-pdf husordensregler.md --config-file pdf-config.json
          npx md-to-pdf utleievilkaar_snippen.md --config-file pdf-config.json
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v7
        with:
          name: genererte-pdf-dokumenter
          path: |
            vedtekter.pdf
            husordensregler.pdf
            utleievilkaar_snippen.pdf
          retention-days: 5
      - name: Opprett Deploy Summary for PDFs
        run: |
          echo "### 📄 PDF-dokumenter generert" >> $GITHUB_STEP_SUMMARY
          echo "Du kan laste ned de oppdaterte PDF-ene (zip) fra [Artifacts-seksjonen](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." >> $GITHUB_STEP_SUMMARY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.github-release.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Sanity check version input
        if: ${{ inputs.version != '' }}
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]{4}\.[0-9]+$ ]]; then
            echo "Feil: Ugyldig versjonsformat. Må være <år>.<løpenr> (f.eks. 2026.1)"
            exit 1
          fi
      - name: Download PDF artifacts
        uses: actions/download-artifact@v8
        with:
          name: genererte-pdf-dokumenter
          path: .
      - name: Create Release
        if: ${{ inputs.version != '' }}
        uses: softprops/action-gh-release@v3
        id: github-release
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Vedtekter og husordensregler Vestre Holmen Sameie ${{ github.event.inputs.version }}
          generate_release_notes: true
          files: |
            vedtekter.pdf
            husordensregler.pdf
            utleievilkaar_snippen.pdf
          body: |
            ## Generelt

            Dette er en release av sameiets vedtekter, husordensregler og utleieilkår.

            [Siste oppdaterte versjon](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)

            På nettsiden finner du alle dokumentene som html og PDF.

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
