name: Validate PR

on:
  pull_request:
    branches: ["main"]

jobs:
  check-changelog:
    name: Check CHANGELOG.md update
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md has been modified
        run: |
          if ! git diff --name-only origin/${{ github.base_ref }} HEAD | grep -q "^CHANGELOG\.md$"; then
            echo "::error::Du må oppdatere CHANGELOG.md for denne endringen!"
            exit 1
          fi
          echo "CHANGELOG.md er oppdatert, alt i orden!"
